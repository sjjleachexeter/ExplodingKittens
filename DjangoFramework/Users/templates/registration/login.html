{% extends "base.html"%} {% block title %}Log In {% endblock %}
{% block content %}
<br>
<h2>Log In</h2>
<div style="justify-content: center; display: flex; align-items: center;">
    <form method = "post" style="text-align: center;">
        {% csrf_token %} <!-- prevents attacks that cause unwanted changes of state-->
        {{ form }}
        <br>
        <div style="text-align: center;"> <!-- change text-align to move button-->
        <button class="btn btn-secondary" type = "submit">Log In</button>
        </div>
    </form>
</div>
<div class="grid_login">
    <div class="grid_login-1"></div>
    <div class="grid_login-3"></div>
    <div class="grid_login-2"></div>
</div>
{% endblock %}
