{% extends "base.html" %} {% block title %}Scan {% endblock %}
{% block content %}
    <head>
        <script src="https://unpkg.com/html5-qrcode"></script>
        <title>Scan a Barcode</title>
    </head>
    <br>
    <div class="container">
        <h3>Scan a product:</h3>
        <div id="scanner_view" style="display: none">
            <div id="reader"></div>
        </div>
        <button id="toggle_scanner_btn" class="btn btn-primary" onclick="toggle_scanner_view()">Scan Barcode</button>
    </div>
    <br>


    <!--Not working? Enter Manually (needs validation)-->
    <form action="{% url 'load_passport' %}" method="post" id="barcode_form" style="text-align: center; align-items: center;">
        {% csrf_token %}
        <div>
            <label class="standouttext" for="barcode" style="padding: 0% 1%"> Not working? Enter Manually: </label> 
            <br>
            <input type="text" id="barcode" name="barcode">
            <button class="btn-secondary" type="submit">Find Product</button>
        <div>

    </form>



{% if user.is_authenticated %}
    <h3>You are level {{request.user.current_level.level}}</h3>
{%endif%}



    {% load static %}
    <script src="{% static 'Scanner/scripts.js' %}"></script>

        


    </body>
    </html>

{% endblock %}
